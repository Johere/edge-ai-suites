monitors:
  cam_child:
    enabled: true
    name: "Child Safety Camera"
    source_url: rtsp://localhost:8557/live/child
    use_case: child_safety
    pipeline_config:
      motion: { enabled: true, diff_threshold: 25, area_ratio: 0.015, stable_frames: 30 }
      # Hazard prefilter: NPU YOLO11s gates summary requests on target classes.
      prefilter:
        enabled: true
        target_classes: [ person, knife, scissors, bottle ]
        min_confidence: 0.4
        detect_fps: 2
        min_frames_hit: 2
        long_side: 1280
        device: NPU
      # ROI crop — only the target region is sent to the summary service.
      roi:
        enabled: true
        mode: crop
        expand: 0.25
        auto_split_area: 0.35
      recording: { enabled: true, interval_seconds: 60 }
      segment: { max_duration: 10 }
  cam_elder_care:
    enabled: true
    name: "Elder Care Bedroom Camera"
    source_url: rtsp://localhost:8557/live/eldercare
    use_case: elder_care
    pipeline_config:
      prefilter:
        enabled: true
        labels_source: embedded
        target_classes:
          - person
        device: NPU
      roi:
        enabled: false
      segment: { max_duration: 20 }
